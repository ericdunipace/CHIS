name: Run R Code with renv and testthat

on:
  push:
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/latest
      RENV_CONFIG_INSTALL_STAGED: false
      RENV_CONFIG_CACHE_SYMLINKS: FALSE
      RENV_ROBOCOPY_SAFETY: false
      RENV_CONFIG_VERBOSE: TRUE
      RENV_CONFIG_PACKAGE_TYPE: binary
      RENV_PROFILE: local

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.6.1'  # version in renv/profiles/local/renv.lock

    - name: Install system dependencies (mac)
      if: runner.os == 'macOS'
      run: |
        brew install --cask xquartz
        brew install gcc udunits gettext jq gdal
    
    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libcurl4-openssl-dev libssl-dev libxml2-dev \
          libharfbuzz-dev libfribidi-dev libfreetype6-dev \
          libpng-dev libtiff5-dev libjpeg-dev \
          libudunits2-dev libgdal-dev gdal-bin \
          libgeos-dev libproj-dev libgettextpo-dev gettext \
          libx11-dev libnode-dev cmake libcairo2-dev libfontconfig1-dev pandoc
          
    # .Rprofile activates renv, which bootstraps itself; restore installs the
    # versions locked in renv/profiles/local/renv.lock
    - name: Restore the local renv library
      shell: Rscript {0}
      run: |
        renv::restore(prompt = FALSE)

    # testthat comes from the lockfile; installing it separately would put the
    # library out of sync with it
    - name: Run testthat tests
      run: Rscript tests/testthat.R

    # CI cannot have the CHIS PUF, so the PUF scripts skip themselves and
    # nothing is rendered
    - name: Run the local pipeline
      run: Rscript run_local.R
